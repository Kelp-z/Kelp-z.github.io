</a><script>
    document.addEventListener("click", function (event) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const target = event.target.closest("a, button");
        if (!target) return;

        const ripple = document.createElement("span");
        ripple.className = "click-ripple";
        ripple.style.left = `${event.clientX}px`;
        ripple.style.top = `${event.clientY}px`;
        document.body.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove(), { once: true });
    });

    const tocLinks = Array.from(document.querySelectorAll(".post-single > .toc a[href^='#']"));
    const tocHeadings = tocLinks.map((link) => {
        try {
            return { link, heading: document.getElementById(decodeURIComponent(link.hash.slice(1))) };
        } catch {
            return { link, heading: null };
        }
    }).filter((item) => item.heading);

    if (tocHeadings.length) {
        let ticking = false;
        const updateActiveTocLink = () => {
            let active = tocHeadings[0];
            for (const item of tocHeadings) {
                if (item.heading.getBoundingClientRect().top <= 180) active = item;
            }
            tocLinks.forEach((link) => link.classList.toggle("is-active", link === active.link));
            ticking = false;
        };

        document.addEventListener("scroll", () => {
            if (!ticking) {
                requestAnimationFrame(updateActiveTocLink);
                ticking = true;
            }
        }, { passive: true });
        updateActiveTocLink();
    }
</script>


<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
